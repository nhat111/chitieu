<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tiền Đi Đâu">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ff5d8f">
<title>Tiền Đi Đâu – Sổ chi tiêu</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4e6;--card:#fff;--ink:#2b2540;--muted:#8a829f;--line:#f0e4d4;--accent:#ff5d8f;--sun:#ffb830;--mint:#21c7a8;--sky:#4aa8ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1830;--card:#282443;--ink:#f6f2ff;--muted:#a69fc4;--line:#38335a}}
:root[data-theme="dark"]{--bg:#1b1830;--card:#282443;--ink:#f6f2ff;--muted:#a69fc4;--line:#38335a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{-webkit-text-size-adjust:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-weight:700;min-height:100vh}
.app{max-width:560px;margin:0 auto;padding:14px 14px 110px}
h1,h2,.big{font-family:'Baloo 2','Nunito',sans-serif;margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.top h1{font-size:22px;white-space:nowrap;font-weight:800}
.nav{display:flex;align-items:center;gap:6px}
.nav button,.ghost{border:0;background:var(--card);color:var(--ink);width:36px;height:36px;border-radius:12px;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.nav .m{font-family:'Baloo 2',sans-serif;font-size:15px;min-width:0;white-space:nowrap;padding:0 4px;text-align:center;font-weight:800}
.hero{background:linear-gradient(135deg,var(--accent),var(--sun));color:#fff;border-radius:28px;padding:18px 20px;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.hero small{opacity:.9;font-size:14px}
.hero .big{font-size:40px;font-weight:800;line-height:1.1}
.stats{display:flex;gap:10px;margin-top:10px;font-size:13px}
.stats div{background:rgba(255,255,255,.25);border-radius:14px;padding:6px 10px;flex:1}
.stats b{display:block;font-size:15px}
.card{background:var(--card);border-radius:24px;padding:14px;margin-top:14px;box-shadow:0 4px 0 var(--line)}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dow span{text-align:center;font-size:12px;color:var(--muted);padding-bottom:6px}
.cell{min-width:0;overflow:hidden;aspect-ratio:1/1.1;border:2px solid transparent;border-radius:14px;background:color-mix(in srgb,var(--accent) calc(var(--h,0)*55%),var(--bg));display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px 1px 3px;font:inherit;color:var(--ink);cursor:pointer}
.cell.empty{background:none;cursor:default}
.cell .d{font-size:14px;font-weight:800}
.cell .t{font-size:11px;font-weight:800;color:var(--accent);min-height:12px}
.cell[style*="--h:0."] .t,.cell[style*="--h:1"] .t{color:var(--ink)}
.cell.today .d{background:var(--sky);color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.cell.sel{border-color:var(--ink)}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.head h2{font-size:19px}.head b{color:var(--accent);font-size:17px}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:2px dashed var(--line)}
.item:first-of-type{border-top:0}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none}
.item .n{flex:1;min-width:0}.item .n span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .a{font-weight:800}
.del{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:6px}
.empty-msg{text-align:center;color:var(--muted);padding:14px 0 6px}
.bar{margin-top:10px}.bar .r{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.bar .tr{height:12px;border-radius:8px;background:var(--bg);overflow:hidden}.bar .tr i{display:block;height:100%;border-radius:8px}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(20px + env(safe-area-inset-bottom,0px));border:0;background:var(--accent);color:#fff;font:800 32px/1 'Baloo 2',sans-serif;width:58px;height:58px;padding:0 0 4px;border-radius:50%;box-shadow:0 5px 0 rgba(0,0,0,.18);cursor:pointer}
.fab:active,.save:active{transform:translateY(3px);box-shadow:none}
.ov{position:fixed;inset:0;background:rgba(20,10,40,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow-x:hidden;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{font-size:21px;margin-bottom:10px}
.amt{width:100%;border:3px solid var(--line);background:var(--bg);color:var(--ink);border-radius:18px;padding:10px 14px;font:800 30px 'Baloo 2',sans-serif;outline:none}
.amt:focus,.fld:focus{border-color:var(--accent)}
.quick{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.quick button,.chip{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:20px;padding:6px 12px;font:800 14px 'Nunito',sans-serif;cursor:pointer}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.cats .chip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:16px;font-size:12px}
.cats .chip span{font-size:24px}
.cats .chip.on{border-color:var(--ink);background:var(--c);color:#2b2540}
.fld{min-width:0;max-width:100%}
input[type=date].fld{display:block;-webkit-appearance:none;appearance:none;height:52px;text-align:left}
input[type=date].fld::-webkit-date-and-time-value{text-align:left}
.fld{width:100%;border:3px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:10px 12px;font:700 16px 'Nunito',sans-serif;outline:none;margin-bottom:8px}
.save{width:100%;border:0;background:var(--mint);color:#fff;font:800 18px 'Baloo 2',sans-serif;padding:12px;border-radius:18px;box-shadow:0 5px 0 rgba(0,0,0,.15);cursor:pointer;margin-top:4px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.seg{display:flex;background:var(--bg);border-radius:16px;padding:4px;margin-bottom:10px}.seg button{flex:1;border:0;background:none;color:var(--muted);font:800 15px 'Baloo 2',sans-serif;padding:8px;border-radius:12px;cursor:pointer}.seg button.on{background:var(--accent);color:#fff}.seg button.on[data-t=in]{background:var(--mint)}
.bud{margin-top:10px;background:rgba(255,255,255,.25);border-radius:14px;padding:8px 10px;font-size:13px}.bud .tr{height:10px;border-radius:6px;background:rgba(255,255,255,.35);margin:6px 0 2px;overflow:hidden}.bud .tr i{display:block;height:100%;background:#fff;border-radius:6px}.bud button{border:0;background:#fff;color:var(--accent);border-radius:12px;padding:3px 10px;font:800 12px 'Nunito',sans-serif;cursor:pointer}
.donut{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;margin:4px auto 8px}.donut div{width:80px;height:80px;border-radius:50%;background:var(--card);display:grid;place-items:center;font:800 18px 'Baloo 2',sans-serif}
.cell .e{font-size:12px;line-height:1}.cell.inc{box-shadow:inset 0 -4px 0 var(--mint)}.item[data-e]{cursor:pointer}.item .a.in{color:var(--mint)}#mlabel{cursor:pointer}.tip{display:flex;gap:10px;padding:9px 0;border-top:2px dashed var(--line);font-size:14px;line-height:1.45}.tip:first-child{border-top:0}.tip>span{font-size:22px}.tip b{color:var(--accent)}
.lnk{color:var(--accent);text-decoration:underline;cursor:pointer}.bar{cursor:pointer}.capadd{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px;font-size:13px;color:var(--muted)}.capadd .chip{padding:4px 10px}
.qs{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px}.qs .chip{flex:none;white-space:nowrap;touch-action:manipulation}.star{display:flex;align-items:center;gap:8px;font-size:14px;margin:2px 0 8px}.star input{width:20px;height:20px}
.bk{display:none;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border-radius:18px;padding:10px 12px;margin-bottom:12px;font-size:13px;box-shadow:0 3px 0 var(--line)}.bk button{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:6px 12px;font:800 13px 'Nunito',sans-serif;cursor:pointer;flex:none}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.trend{display:flex;align-items:flex-end;gap:8px;height:128px;margin-top:6px}.trend button{flex:1;border:0;background:none;color:var(--ink);font:800 11px 'Nunito',sans-serif;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%;cursor:pointer;padding:0}.trend i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--line);min-height:4px}.trend button.cur i{background:var(--accent)}.trend span{color:var(--muted)}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>💸 Tiền Đi Đâu</h1>
    <div class="nav"><button id="prev" aria-label="Tháng trước">‹</button><span class="m" id="mlabel"></span><button id="next" aria-label="Tháng sau">›</button></div>
  </div>
  <div class="bk" id="bk"></div>
  <div class="hero">
    <small>Tháng này bạn đã tiêu</small>
    <div class="big" id="mtotal">0đ</div>
    <div class="stats"><div>Thu nhập<b id="inc">+0đ</b></div><div>Còn lại<b id="bal">0đ</b></div><div>TB/ngày<b id="avg">0đ</b></div></div>
    <div class="bud" id="bud"></div>
  </div>
  <div class="card">
    <div class="dow"><span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span>CN</span></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="card">
    <div class="head"><h2 id="dtitle"></h2><b id="dtotal"></b></div>
    <div id="list"></div>
    <div style="font-size:13px;color:var(--muted);margin-top:12px">⚡ Nhập nhanh vào ngày này (giữ lâu để xóa)</div><div class="qs" id="qks"></div>
  </div>
  <div class="card">
    <div class="head"><h2>Chi vào đâu nhiều nhất?</h2></div>
    <div style="font-size:12px;color:var(--muted);margin:-2px 0 4px">Chạm vào một mục để đặt trần chi mỗi tháng</div>
    <div class="donut" id="donut"><div id="dc"></div></div>
    <div id="bars"></div>
  </div>
  <div class="card"><div class="head"><h2>💡 Gợi ý để bớt chi</h2></div><div id="tips"></div></div>
  <div class="card"><div class="head"><h2>6 tháng gần đây</h2></div><div class="trend" id="trend"></div></div>
  <div class="tools"><button class="chip" id="theme">🎨 Đổi màu</button><button class="chip" id="exp">📋 Sao lưu</button><button class="chip" id="imp">📥 Khôi phục</button></div>
  <div id="bkinfo" style="font-size:12px;color:var(--muted);margin-top:8px"></div>
</div>
<button class="fab" id="fab" aria-label="Thêm khoản chi">+</button>

<div class="ov" id="ov">
  <div class="sheet" role="dialog" aria-label="Thêm khoản chi">
    <h2 id="sh">Thêm khoản</h2><div class="seg" id="seg"><button data-t="out" class="on">💸 Chi tiêu</button><button data-t="in">💰 Thu nhập</button></div>
    <input class="amt" id="amt" inputmode="numeric" placeholder="Số tiền (đ)" autocomplete="off">
    <div class="quick"><button data-a="10000">+10k</button><button data-a="20000">+20k</button><button data-a="50000">+50k</button><button data-a="100000">+100k</button></div>
    <div class="cats" id="cats"></div>
    <div style="font-size:12px;color:var(--muted);margin:-4px 0 8px">Mục tự tạo: giữ lâu để đổi tên hoặc xóa</div>
    <input class="fld" id="note" placeholder="Ghi chú (không bắt buộc)" maxlength="60">
    <input class="fld" id="date" type="date">
    <select class="fld" id="rep"><option value="">🔁 Không lặp lại</option><option value="w">Lặp mỗi tuần (12 lần)</option><option value="m">Lặp mỗi tháng (12 lần)</option></select>
    <label class="star" id="qkl"><input type="checkbox" id="qk"> ⭐ Lưu thành nhập nhanh</label>
    <button class="save" id="save">Lưu khoản chi</button>
  </div>
</div>
<div class="ov" id="ov2"><div class="sheet"><h2 id="q-t"></h2><input class="fld" id="q-i" autocomplete="off"><div style="display:flex;gap:8px"><button class="chip" id="q-no" style="flex:1">Hủy</button><button class="save" id="q-ok" style="flex:2;margin:0">OK</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
const CATS=[
 {id:'an',n:'Ăn uống',e:'🍜',c:'#ffd9a8'},{id:'cf',n:'Cà phê',e:'🧋',c:'#f3d3ff'},
 {id:'di',n:'Đi lại',e:'🛵',c:'#c9e6ff'},{id:'mua',n:'Mua sắm',e:'🛍️',c:'#ffd0df'},
 {id:'nha',n:'Nhà cửa',e:'🏠',c:'#cdf3e8'},{id:'vui',n:'Giải trí',e:'🎮',c:'#fff1a8'},
 {id:'sk',n:'Sức khỏe',e:'💊',c:'#ffd3d3'},{id:'khac',n:'Khác',e:'✨',c:'#e3e0f5'}];
const COL={an:'#ff9f43',cf:'#c56bff',di:'#4aa8ff',mua:'#ff5d8f',nha:'#21c7a8',vui:'#ffcf33',sk:'#ff6b6b',khac:'#9a92c4'};
const INC=[{id:'luong',n:'Lương',e:'💰',c:'#cdf3e8'},{id:'qua',n:'Quà, thưởng',e:'🎁',c:'#ffd9a8'},{id:'ban',n:'Bán đồ',e:'🏷️',c:'#c9e6ff'},{id:'tk',n:'Thu khác',e:'🪙',c:'#fff1a8'}];
let custom=[],quick=[];try{custom=JSON.parse(localStorage.getItem('heo-dat-cats')||'[]')}catch(e){}
try{quick=JSON.parse(localStorage.getItem('heo-dat-quick')||'[]')}catch(e){}
custom.forEach(c=>{CATS.push(c);COL[c.id]=c.col});
const ALL=CATS.concat(INC);
const KEY='heo-dat-v1',BK='heo-dat-budget';
let budget=0,type='out';
try{budget=Number(localStorage.getItem(BK))||0}catch(e){}
let caps={};try{caps=JSON.parse(localStorage.getItem('heo-dat-caps')||'{}')}catch(e){}
let data=[];
try{data=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){data=[]}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const money=n=>Math.round(n).toLocaleString('vi-VN')+'đ';
const short=n=>n>=1e6?(n/1e6).toFixed(1).replace('.0','')+'tr':n>=1000?Math.round(n/1000)+'k':String(n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=new Date();
let view=new Date(today.getFullYear(),today.getMonth(),1);
let sel=iso(today), cat='an';
const DOW=['Chủ nhật','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'];

function render(){
  const y=view.getFullYear(),m=view.getMonth();
  $('mlabel').textContent='Tháng '+(m+1)+'/'+y;
  const days=new Date(y,m+1,0).getDate();
  const pre=y+'-'+pad(m+1)+'-';
  const all=data.filter(x=>x.date.startsWith(pre));const mon=all.filter(x=>x.type!=='in');const incT=all.filter(x=>x.type==='in').reduce((s,x)=>s+x.amount,0);
  const byDay={};mon.forEach(x=>byDay[x.date]=(byDay[x.date]||0)+x.amount);
  const total=mon.reduce((s,x)=>s+x.amount,0);
  const max=Math.max(0,...Object.values(byDay));
  const incD={},dc={};all.forEach(x=>{if(x.type==='in')incD[x.date]=1;else{const o=dc[x.date]=dc[x.date]||{};o[x.cat]=(o[x.cat]||0)+x.amount}});
  const topE=k=>{const o=dc[k];if(!o)return'';const id=Object.keys(o).sort((a,b)=>o[b]-o[a])[0];return(ALL.find(c=>c.id===id)||{}).e||''};
  const maxDay=Object.keys(byDay).find(k=>byDay[k]===max);
  const isCur=y===today.getFullYear()&&m===today.getMonth();
  const elapsed=isCur?today.getDate():days;
  $('mtotal').textContent=money(total);
  $('avg').textContent=money(total/elapsed);
  $('inc').textContent='+'+money(incT);$('bal').textContent=incT?money(incT-total):'–';
  const bd=$('bud'),row=(t,b)=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span>${t}</span><button id="setb">${b}</button></div>`;
  if(budget){const p=total/budget,left=budget-total;
    bd.innerHTML=row(p>=1?'😱 Vượt ngân sách '+money(-left):p>.8?'😬 Sắp hết, còn '+money(left):p>.5?'🙂 Còn '+money(left)+' nha':'😎 Ví còn dày, còn '+money(left),'Sửa')+`<div class="tr"><i style="width:${Math.min(100,p*100)}%"></i></div>`}
  else bd.innerHTML=row('🎯 Chưa đặt ngân sách tháng','Đặt ngay');
  $('setb').onclick=setBudget;
  const first=(new Date(y,m,1).getDay()+6)%7;
  let h='';
  for(let i=0;i<first;i++)h+='<div class="cell empty"></div>';
  for(let d=1;d<=days;d++){
    const k=pre+pad(d),v=byDay[k]||0,r=max?(v/max).toFixed(2):0;
    h+=`<button class="cell${k===iso(today)?' today':''}${k===sel?' sel':''}${incD[k]?' inc':''}" data-d="${k}" style="--h:${v?Math.max(r,0.15):0}"><span class="d">${d}</span><span class="t">${v?short(v):''}</span></button>`;
  }
  $('grid').innerHTML=h;
  renderDay();
  const bc={};mon.forEach(x=>bc[x.cat]=(bc[x.cat]||0)+x.amount);
  const rows=CATS.filter(c=>bc[c.id]).sort((a,b)=>bc[b.id]-bc[a.id]);
  renderTrend();renderTips({mon,total,elapsed,days,bc,y,m,isCur,incT});let acc=0;$('donut').style.background=rows.length?'conic-gradient('+rows.map(c=>{const s=acc;acc+=bc[c.id]/total*100;return COL[c.id]+' '+s+'% '+acc+'%'}).join(',')+')':'var(--bg)';$('dc').textContent=rows.length?short(total):'Trống';
  $('bars').innerHTML=rows.length?rows.map(c=>`<div class="bar"><div class="r"><span>${c.e} ${c.n}</span><span>${money(bc[c.id])} · ${Math.round(bc[c.id]/total*100)}%</span></div><div class="tr"><i style="width:${bc[c.id]/total*100}%;background:${COL[c.id]}"></i></div></div>`).join(''):'<div class="empty-msg">Chưa có khoản nào trong tháng này</div>';
  renderBars(bc,total);renderBk();
}
function renderDay(){
  const dt=new Date(sel+'T00:00:00');
  const items=data.filter(x=>x.date===sel);
  $('dtitle').textContent=DOW[dt.getDay()]+', '+dt.getDate()+'/'+(dt.getMonth()+1);
  $('dtotal').textContent=money(items.filter(x=>x.type!=='in').reduce((s,x)=>s+x.amount,0));
  $('list').innerHTML=items.length?items.map(x=>{const c=ALL.find(c=>c.id===x.cat)||CATS[7];
    return `<div class="item" data-e="${x.id}"><div class="ic" style="background:${c.c}">${c.e}</div><div class="n">${c.n}<span>${esc(x.note||'')}</span></div><div class="a${x.type==='in'?' in':''}">${x.type==='in'?'+':''}${money(x.amount)}</div><button class="del" data-x="${x.id}" aria-label="Xóa">✕</button></div>`}).join(''):'<div class="empty-msg">Ngày này chưa chi gì 🎉<br>Bấm “Thêm khoản chi” để ghi lại nhé</div>';
}
let tt;function toast(t,u){const e=$('toast');e.textContent=t;e.style.pointerEvents=u?'auto':'none';if(u){const b=document.createElement('button');b.textContent='Hoàn tác';b.style.cssText='margin-left:10px;border:0;border-radius:10px;padding:3px 10px;font:800 13px Nunito,sans-serif;background:var(--accent);color:#fff;cursor:pointer';b.onclick=()=>{u();e.classList.remove('on')};e.appendChild(b)}e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),u?4500:1600)}
let editId=null;
function drawCats(){$('cats').innerHTML=(type==='in'?INC:CATS).map(c=>`<button class="chip${c.id===cat?' on':''}" data-c="${c.id}" style="--c:${c.c}"><span>${c.e}</span>${c.n}</button>`).join('')+(type==='in'?'':'<button class="chip" data-c="__new" style="--c:var(--line)"><span>＋</span>Mục mới</button>');[...$('seg').children].forEach(b=>b.classList.toggle('on',b.dataset.t===type))}
function openSheet(x){editId=x?x.id:null;if(x){type=x.type||'out';cat=x.cat}else{type='out';cat='an'}drawCats();
  
  $('date').value=x?x.date:sel;$('amt').value=x?x.amount.toLocaleString('vi-VN'):'';$('note').value=x?x.note||'':'';$('sh').textContent=x?'Sửa khoản':'Thêm khoản';$('rep').value='';$('rep').style.display=x?'none':'';$('qk').checked=false;$('qkl').style.display=x?'none':'';
  $('ov').classList.add('on');setTimeout(()=>$('amt').focus({preventScroll:true}),50);
}
const num=()=>Number($('amt').value.replace(/\D/g,''))||0;
const fmtAmt=n=>$('amt').value=n?n.toLocaleString('vi-VN'):'';

$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};
$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};
$('grid').onclick=e=>{const b=e.target.closest('.cell[data-d]');if(b){sel=b.dataset.d;render()}};
$('list').onclick=e=>{const it=e.target.closest('.item');if(it&&!e.target.closest('.del')){openSheet(data.find(x=>String(x.id)===it.dataset.e));return}const b=e.target.closest('.del');if(b){const x=data.find(y=>String(y.id)===b.dataset.x);data=data.filter(y=>y!==x);save();render();toast('Đã xóa khoản chi',()=>{data.push(x);save();render()})}};
$('fab').onclick=()=>openSheet();
$('ov').onclick=e=>{if(e.target===$('ov'))$('ov').classList.remove('on')};
$('cats').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;if(b.dataset.c==='__new'){newCat();return}cat=b.dataset.c;[...$('cats').children].forEach(c=>c.classList.toggle('on',c===b))};
$('amt').oninput=()=>{const el=$('amt'),pos=el.selectionStart,k=el.value.slice(0,pos).replace(/\D/g,'').length;fmtAmt(num());let c=0,i=0;for(;i<el.value.length&&c<k;i++)if(/\d/.test(el.value[i]))c++;el.setSelectionRange(i,i)};
document.querySelector('.quick').onclick=e=>{const b=e.target.closest('button');if(b)fmtAmt(num()+Number(b.dataset.a))};
$('save').onclick=()=>{
  const a=num();
  if(!a){toast('Nhập số tiền trước nha 💸');$('amt').focus();return}
  const d=$('date').value||sel;
  const rec={id:editId||Date.now(),date:d,amount:a,cat,type,note:$('note').value.trim()};
  if($('qk').checked&&!editId){quick.push({id:Date.now()+1,cat,amount:a,note:rec.note,type});saveQ();renderQuick()}
  if(editId)data=data.map(x=>x.id===editId?rec:x);else{data.push(rec);const rp=$('rep').value;if(rp){const b=new Date(d+'T00:00:00');for(let i=1;i<12;i++){const n=new Date(b);if(rp==='w')n.setDate(b.getDate()+7*i);else{n.setMonth(b.getMonth()+i,1);n.setDate(Math.min(b.getDate(),new Date(n.getFullYear(),n.getMonth()+1,0).getDate()))}data.push({...rec,id:rec.id+i,date:iso(n)})}}}
  save();sel=d;
  const dd=new Date(d+'T00:00:00');view=new Date(dd.getFullYear(),dd.getMonth(),1);
  $('ov').classList.remove('on');render();toast('Đã lưu '+money(a)+' ✓');
};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('ov').classList.remove('on');if(e.key==='Enter'){if($('ov2').classList.contains('on'))$('q-ok').click();else if($('ov').classList.contains('on'))$('save').click()}});
$('seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;type=b.dataset.t;cat=type==='in'?'luong':'an';drawCats()};
$('mlabel').onclick=()=>{view=new Date(today.getFullYear(),today.getMonth(),1);sel=iso(today);render()};
function setBudget(){ask('Ngân sách chi tiêu mỗi tháng (đ)',budget||'',v=>setB(v),'Lưu')}function setB(v){budget=Number(String(v).replace(/\D/g,''))||0;try{localStorage.setItem(BK,budget)}catch(e){}render()}
function bkJson(){return JSON.stringify({v:2,data,budget,caps,custom,quick})}
$('exp').onclick=async()=>{const j=bkJson(),n='tien-di-dau-'+iso(new Date())+'.json';
  try{const f=new File([j],n,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Sao lưu Tiền Đi Đâu'});markBk();toast('Đã sao lưu ✓');return}
  }catch(e){if(e&&e.name==='AbortError')return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download=n;document.body.appendChild(a);a.click();a.remove();markBk();toast('Đã tải file sao lưu ✓')}
  catch(e){ask('Chép đoạn này để sao lưu',j,markBk,'Xong')}};
const pick=document.createElement('input');pick.type='file';pick.accept='.json,application/json';pick.style.display='none';document.body.appendChild(pick);
pick.onchange=()=>{const f=pick.files[0];if(!f)return;f.text().then(t=>{try{applyBackup(JSON.parse(t));toast('Đã khôi phục ✓')}catch(e){toast('File không hợp lệ')}pick.value=''})};
$('imp').onclick=()=>pick.click();
function applyBackup(o){if(!o||!Array.isArray(o.data))throw 0;
  custom.forEach(c=>{const i=CATS.indexOf(c);if(i>-1)CATS.splice(i,1);const k=ALL.indexOf(c);if(k>-1)ALL.splice(k,1)});
  custom=Array.isArray(o.custom)?o.custom:[];custom.forEach(c=>{CATS.push(c);ALL.push(c);COL[c.id]=c.col});
  quick=Array.isArray(o.quick)?o.quick:[];data=o.data;budget=Number(o.budget)||0;caps=o.caps||{};
  save();saveCats();saveQ();try{localStorage.setItem(BK,budget);localStorage.setItem('heo-dat-caps',JSON.stringify(caps))}catch(e){}
  render();renderQuick()}
function renderTips(o){const {mon,total,elapsed,days,bc,y,m,isCur,incT}=o,t=[],c=id=>ALL.find(x=>x.id===id)||CATS[7],el=$('tips');
  if(!mon.length){el.innerHTML='<div class="empty-msg">Nhập vài khoản chi, mình sẽ soi giúp chỗ nào bớt được 🔍</div>';return}
  const pm=new Date(y,m-1,1),pp=pm.getFullYear()+'-'+pad(pm.getMonth()+1)+'-',pc={};
  data.filter(x=>x.type!=='in'&&x.date.startsWith(pp)).forEach(x=>pc[x.cat]=(pc[x.cat]||0)+x.amount);
  const ks=Object.keys(bc),top=ks.sort((a,b)=>bc[b]-bc[a])[0];
  ks.filter(k=>caps[k]&&bc[k]>=caps[k]*.8).forEach(k=>t.unshift([bc[k]>caps[k]?'🚨':'⏰',`<b>${c(k).n}</b> ${bc[k]>caps[k]?'đã vượt trần '+money(bc[k]-caps[k]):'đã dùng '+Math.round(bc[k]/caps[k]*100)+'% trần'} (${money(bc[k])}/${money(caps[k])}).`]));
  if(budget&&isCur&&elapsed>=3){const pr=total/elapsed*days,rest=days-elapsed;
    if(pr>budget)t.push(['⚠️',`Với nhịp hiện tại, cuối tháng bạn sẽ chi khoảng <b>${money(pr)}</b>, vượt ngân sách ${money(pr-budget)}.${rest>0?' Từ giờ mỗi ngày nên chi ≤ <b>'+money(Math.max(0,(budget-total)/rest))+'</b>.':''}`]);
    else t.push(['✅',`Nhịp chi đang ổn: dự kiến cuối tháng ~${money(pr)}, dư ${money(budget-pr)} so với ngân sách.`])}
  else if(!budget)t.push(['🎯','Chưa có ngân sách tháng. Đặt một con số để mình tính nhịp chi mỗi ngày giúp bạn.']);
  if(bc[top]/total>.4&&mon.length>2)t.push(['📊',`<b>${c(top).n}</b> chiếm ${Math.round(bc[top]/total*100)}% chi tiêu (${money(bc[top])}). Đặt trần riêng cho mục này, giảm 15% là giữ lại ${money(bc[top]*.15)}.${caps[top]?'':` <a class="lnk" data-c="${top}">Đặt trần ngay</a>`}`]);
  ks.map(k=>[k,bc[k],pc[k]||0]).filter(r=>r[2]&&r[1]>r[2]*1.3&&r[1]-r[2]>=50000).sort((a,b)=>(b[1]-b[2])-(a[1]-a[2])).slice(0,1).forEach(r=>t.push(['📈',`<b>${c(r[0]).n}</b> tăng ${Math.round((r[1]/r[2]-1)*100)}% so với tháng trước (+${money(r[1]-r[2])}). Xem lại có khoản nào không cần thiết không.`]));
  const fq=['an','cf'].map(k=>[k,mon.filter(x=>x.cat===k).length]).filter(r=>r[1]>=6).sort((a,b)=>bc[b[0]]-bc[a[0]])[0];
  if(fq)t.push(['☕',`<b>${c(fq[0]).n}</b> ${fq[1]} lần, trung bình ${money(bc[fq[0]]/fq[1])}/lần. Bớt 1/3 số lần (tự nấu, mang theo) tiết kiệm ~${money(bc[fq[0]]/3)}.`]);
  if(incT>0&&(incT-total)/incT<.2)t.push(['🐷',`Mới giữ lại ${Math.max(0,Math.round((incT-total)/incT*100))}% thu nhập. Mục tiêu phổ biến là 20%, cần giảm thêm ${money(incT*.2-(incT-total))}.`]);
  const big=mon.reduce((a,x)=>x.amount>a.amount?x:a,mon[0]);
  if(mon.length>3&&big.amount/total>.3)t.push(['💎',`Khoản lớn nhất ${money(big.amount)}${big.note?' ('+esc(big.note)+')':''} chiếm ${Math.round(big.amount/total*100)}% tháng. Với khoản lớn, thử chờ 24 giờ trước khi mua.`]);
  el.innerHTML=t.length?t.slice(0,4).map(r=>`<div class="tip"><span>${r[0]}</span><div>${r[1]}</div></div>`).join(''):'<div class="empty-msg">Chi tiêu tháng này khá cân đối, chưa thấy gì đáng lo 👏</div>'}
function renderTrend(){const arr=[];for(let i=5;i>=0;i--){const d=new Date(view.getFullYear(),view.getMonth()-i,1),p=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-';arr.push({d,v:data.filter(x=>x.type!=='in'&&x.date.startsWith(p)).reduce((s,x)=>s+x.amount,0),cur:i===0})}
  const mx=Math.max(1,...arr.map(a=>a.v));
  $('trend').innerHTML=arr.map((a,i)=>`<button class="${a.cur?'cur':''}" data-i="${i}"><span>${a.v?short(a.v):''}</span><i style="height:${a.v/mx*80}px"></i><span>T${a.d.getMonth()+1}</span></button>`).join('');
  $('trend').onclick=e=>{const b=e.target.closest('button');if(!b)return;view=new Date(arr[b.dataset.i].d);render()}}
const TH=[['#ff5d8f','#ffb830'],['#8f6bff','#ff8fd0'],['#21c7a8','#9be15d'],['#4aa8ff','#7b61ff']];
let ti=0;try{ti=Number(localStorage.getItem('heo-dat-theme'))||0}catch(e){}
function applyTh(){const t=TH[ti%TH.length],s=document.documentElement.style;s.setProperty('--accent',t[0]);s.setProperty('--sun',t[1])}
$('theme').onclick=()=>{ti=(ti+1)%TH.length;try{localStorage.setItem('heo-dat-theme',ti)}catch(e){}applyTh();toast('Đã đổi màu 🎨')};
function renderBars(bc,total){const ls=CATS.filter(c=>bc[c.id]||caps[c.id]).sort((a,b)=>(bc[b.id]||0)-(bc[a.id]||0)),rest=CATS.filter(c=>!bc[c.id]&&!caps[c.id]);
  $('bars').innerHTML=(ls.length?ls.map(c=>{const v=bc[c.id]||0,cp=caps[c.id]||0,over=cp&&v>cp,w=cp?Math.min(100,v/cp*100):v/total*100;
    return `<div class="bar" data-c="${c.id}"><div class="r"><span>${c.e} ${c.n}</span><span${over?' style="color:#ff4d4d"':''}>${money(v)}${cp?' / '+money(cp):' · '+Math.round(v/total*100)+'%'}</span></div><div class="tr"><i style="width:${w}%;background:${over?'#ff4d4d':COL[c.id]}"></i></div></div>`}).join(''):'<div class="empty-msg">Chưa có khoản nào trong tháng này</div>')+(rest.length?`<div class="capadd"><span>🎯 Đặt trần cho:</span>${rest.map(c=>`<button class="chip" data-c="${c.id}">${c.e} ${c.n}</button>`).join('')}</div>`:'')}
function setCap(id){const c=CATS.find(x=>x.id===id);if(!c)return;ask('Trần chi '+c.n+' mỗi tháng (đ). Để trống để bỏ trần',caps[id]||'',v=>{const n=Number(String(v).replace(/\D/g,''))||0;if(n)caps[id]=n;else delete caps[id];try{localStorage.setItem('heo-dat-caps',JSON.stringify(caps))}catch(e){}render()},'Lưu')}
$('bars').onclick=e=>{const b=e.target.closest('[data-c]');if(b)setCap(b.dataset.c)};
$('tips').onclick=e=>{const b=e.target.closest('[data-c]');if(b)setCap(b.dataset.c)};
function saveQ(){try{localStorage.setItem('heo-dat-quick',JSON.stringify(quick))}catch(e){}}
function saveCats(){try{localStorage.setItem('heo-dat-cats',JSON.stringify(custom))}catch(e){}}
function renderQuick(){$('qks').innerHTML=quick.length?quick.map(q=>{const c=ALL.find(x=>x.id===q.cat)||CATS[7];return `<button class="chip" data-q="${q.id}">${c.e} ${esc(q.note||c.n)} ${short(q.amount)}</button>`}).join(''):'<span style="font-size:12px;color:var(--muted)">Khi thêm khoản, tick “⭐ Lưu thành nhập nhanh” để lần sau chạm một cái là ghi xong</span>'}
let lq=0,lqd=0;
$('qks').addEventListener('pointerdown',e=>{const b=e.target.closest('[data-q]');if(!b)return;lqd=0;lq=setTimeout(()=>{lqd=1;ask('Xóa mục nhập nhanh này?',null,()=>{quick=quick.filter(x=>String(x.id)!==b.dataset.q);saveQ();renderQuick()},'Xóa')},600)});
['pointerup','pointerleave','pointercancel'].forEach(t=>$('qks').addEventListener(t,()=>clearTimeout(lq)));
$('qks').onclick=e=>{const b=e.target.closest('[data-q]');if(!b)return;if(lqd){lqd=0;return}const q=quick.find(x=>String(x.id)===b.dataset.q);if(!q)return;const r={id:Date.now(),date:sel,amount:q.amount,cat:q.cat,type:q.type||'out',note:q.note};data.push(r);save();render();toast('Đã thêm '+money(q.amount),()=>{data=data.filter(x=>x!==r);save();render()})};
function parseCat(v){v=v.trim();const m=v.match(/^(\S+)\s+(.+)$/);return m&&!/^[\p{L}\p{N}]/u.test(m[1])?{e:m[1],n:m[2].slice(0,16)}:{e:'🏷️',n:v.slice(0,16)}}
function newCat(){ask('Tên mục mới (có thể kèm emoji). Ví dụ: 🐶 Thú cưng','',v=>{if(!v.trim())return;const p=parseCat(v),cs=['#ffd9a8','#f3d3ff','#c9e6ff','#ffd0df','#cdf3e8','#fff1a8'],ac=['#ff9f43','#c56bff','#4aa8ff','#ff5d8f','#21c7a8','#ffcf33'],i=custom.length%6,c={id:'c_'+Date.now().toString(36),n:p.n,e:p.e,c:cs[i],col:ac[i]};custom.push(c);CATS.push(c);ALL.push(c);COL[c.id]=c.col;saveCats();cat=c.id;drawCats()},'Thêm')}
function editCat(id){const c=custom.find(x=>x.id===id);if(!c)return;ask('Đổi tên mục (để trống để xóa mục này)',c.e+' '+c.n,v=>{if(v.trim()){const p=parseCat(v);c.n=p.n;c.e=p.e}else{data.forEach(x=>{if(x.cat===id)x.cat='khac'});custom=custom.filter(x=>x!==c);CATS.splice(CATS.indexOf(c),1);ALL.splice(ALL.indexOf(c),1);if(cat===id)cat='an';save()}saveCats();drawCats();render();renderQuick()},'Lưu')}
let lp=0;$('cats').addEventListener('pointerdown',e=>{const b=e.target.closest('.chip');if(!b||!/^c_/.test(b.dataset.c))return;lp=setTimeout(()=>editCat(b.dataset.c),600)});
['pointerup','pointerleave','pointercancel'].forEach(t=>$('cats').addEventListener(t,()=>clearTimeout(lp)));
function markBk(){try{localStorage.setItem('heo-dat-lastbk',Date.now())}catch(e){}renderBk()}
function renderBk(){let t=0;try{t=Number(localStorage.getItem('heo-dat-lastbk'))||0}catch(e){}const d=t?Math.floor((Date.now()-t)/864e5):-1,due=data.length>3&&(d<0||d>=14),b=$('bk');
  b.style.display=due?'flex':'none';b.innerHTML=due?`<span>💾 ${d<0?'Bạn chưa sao lưu lần nào':'Đã '+d+' ngày chưa sao lưu'}, dữ liệu chỉ nằm trên máy này.</span><button id="bkgo">Sao lưu</button>`:'';
  $('bkinfo').textContent=t?'Sao lưu lần cuối: '+(d===0?'hôm nay':d+' ngày trước'):'Chưa sao lưu lần nào';if(due)$('bkgo').onclick=()=>$('exp').click()}
renderQuick();
function ask(t,v,cb,ok){$('q-t').textContent=t;const i=$('q-i');i.style.display=v===null?'none':'';i.value=v||'';$('q-ok').textContent=ok||'OK';$('ov2').classList.add('on');if(v!==null)setTimeout(()=>i.focus(),50);
  const done=y=>{$('ov2').classList.remove('on');if(y)cb(i.value)};$('q-ok').onclick=()=>done(true);$('q-no').onclick=()=>done(false)}
applyTh();
render();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(new URLSearchParams(location.search).get('add')){history.replaceState(null,'',location.pathname);openSheet()}
</script>
